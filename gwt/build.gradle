apply plugin: 'java'
apply plugin: 'maven-publish'

base {
    archivesName = 'jmini3d-gwt'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'org.gwtproject:gwt-user:2.13.1'
    implementation 'org.gwtproject:gwt-dev:2.13.1'
    implementation('com.mobialia:gwtgl:1.1.0')
    implementation('com.mobialia:gwtgl:1.1.0:sources')
    implementation project(':core')
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource

    from('../core/') {
        include 'shaders/**'
    }
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        jmini3dGwt(MavenPublication) {
            from components.java
            artifactId = 'jmini3d-gwt'
            artifact sourcesJar
        }
    }
}
